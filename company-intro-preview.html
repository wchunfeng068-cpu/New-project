<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Company Intro Preview</title>
    <style>
      :root {
        --bg: #f5eee3;
        --bg-2: #e2d4c3;
        --ink: #101010;
        --gold: #d9a300;
        --shadow: 0 28px 70px rgba(93, 68, 31, 0.18);
        --radius: 24px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.75), transparent 28%),
          linear-gradient(135deg, #f8f3eb 0%, #f0e7dc 42%, #ebe0d2 100%);
        font-family: "Georgia", "Times New Roman", serif;
      }

      .frame {
        width: min(760px, calc(100vw - 48px));
        padding: 18px;
      }

      .card {
        overflow: hidden;
        border-radius: var(--radius);
        border: 1px solid rgba(173, 152, 123, 0.24);
        background: linear-gradient(180deg, #fffaf2 0%, #f3eadf 100%);
        box-shadow: var(--shadow);
      }

      .image {
        position: relative;
        aspect-ratio: 4 / 3;
        background:
          radial-gradient(circle at 24% 22%, rgba(255, 255, 255, 0.72), transparent 28%),
          radial-gradient(circle at 78% 84%, rgba(161, 121, 67, 0.12), transparent 26%),
          linear-gradient(135deg, #f4efe6 0%, #e8ded0 58%, #d8c5af 100%);
      }

      .image::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(115deg, rgba(255, 255, 255, 0.46), transparent 32%),
          radial-gradient(circle at 85% 36%, rgba(0, 0, 0, 0.06), transparent 22%);
        mix-blend-mode: screen;
        pointer-events: none;
      }

      .swatches {
        position: absolute;
        left: 26px;
        top: 44px;
        display: grid;
        gap: 8px;
      }

      .swatch {
        width: 16px;
        height: 16px;
        border-radius: 50%;
        border: 1px solid rgba(16, 16, 16, 0.12);
        box-shadow: 0 3px 10px rgba(16, 16, 16, 0.06);
      }

      .swatch:nth-child(1) { background: #d8c9b6; }
      .swatch:nth-child(2) { background: #b7c7d9; }
      .swatch:nth-child(3) { background: #9aa9ba; }
      .swatch:nth-child(4) { background: #6f7f93; }
      .swatch:nth-child(5) { background: #414e61; }

      .suitcase {
        position: absolute;
        right: 92px;
        top: 78px;
        width: 134px;
        height: 182px;
        border-radius: 16px;
        background:
          linear-gradient(180deg, #f5f7fb 0%, #c8d6e8 100%);
        border: 1px solid rgba(79, 103, 138, 0.18);
        box-shadow:
          0 22px 45px rgba(68, 83, 105, 0.22),
          inset 0 0 0 1px rgba(255, 255, 255, 0.4);
      }

      .suitcase::before,
      .suitcase::after {
        content: "";
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
      }

      .suitcase::before {
        top: -22px;
        width: 52px;
        height: 24px;
        border-radius: 12px 12px 5px 5px;
        background: linear-gradient(180deg, #f7fafc 0%, #b3c2d4 100%);
        box-shadow: 0 0 0 1px rgba(84, 96, 112, 0.16);
      }

      .suitcase::after {
        inset: 14px 0 14px;
        border-radius: 12px;
        background:
          linear-gradient(90deg, rgba(255, 255, 255, 0.18) 0 12%, transparent 12% 100%),
          repeating-linear-gradient(
            90deg,
            rgba(54, 74, 97, 0.14) 0 2px,
            transparent 2px 14px
          );
        opacity: 0.45;
      }

      .shadow {
        position: absolute;
        right: 80px;
        bottom: 40px;
        width: 180px;
        height: 36px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(63, 49, 29, 0.24), transparent 70%);
        filter: blur(8px);
      }

      .caption {
        position: absolute;
        left: 26px;
        bottom: 22px;
        display: grid;
        gap: 6px;
        color: var(--ink);
      }

      .eyebrow {
        font-size: 11px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        opacity: 0.72;
      }

      .title {
        margin: 0;
        font-size: 30px;
        line-height: 1.06;
        font-weight: 500;
      }

      .desc {
        margin: 0;
        max-width: 250px;
        font-family: "Arial", "Helvetica Neue", sans-serif;
        font-size: 13px;
        line-height: 1.5;
        color: rgba(16, 16, 16, 0.68);
      }

      .badge {
        position: absolute;
        right: 24px;
        bottom: 22px;
        padding: 9px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.55);
        border: 1px solid rgba(16, 16, 16, 0.08);
        font-family: Arial, sans-serif;
        font-size: 12px;
        color: rgba(16, 16, 16, 0.56);
        backdrop-filter: blur(6px);
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <section class="card" aria-label="Company intro preview">
        <div class="image">
          <div class="swatches" aria-hidden="true">
            <span class="swatch"></span>
            <span class="swatch"></span>
            <span class="swatch"></span>
            <span class="swatch"></span>
            <span class="swatch"></span>
          </div>
          <div class="suitcase" aria-hidden="true"></div>
          <div class="shadow" aria-hidden="true"></div>
          <div class="caption">
            <div class="eyebrow">Premium B2B</div>
            <h1 class="title">公司介绍</h1>
            <p class="desc">立足中国供应链，面向全球市场，呈现品牌的专业、稳重与高品质交付感。</p>
          </div>
          <div class="badge">TRAVELDAY</div>
        </div>
      </section>
    </div>
  </body>
</html>
