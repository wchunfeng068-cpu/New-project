<!doctype html>
<html lang="en" data-default-lang="en" data-nav-ready="true">
  <head>
    <meta charset="utf-8" />
    <!-- Hide the page only while it is being switched to another language (avoids a flash of
         the wrong language); visitors in the page's own language see it immediately. -->
    <script>(function(){try{var d=document.documentElement,l=new URLSearchParams(location.search).get('lang')||localStorage.getItem('travelday-site-language');if(l&&l!==(d.getAttribute('data-default-lang')||'en'))d.classList.add('i18n-pending');}catch(e){}})();</script>
    <!-- Chrome/Edge: when the visitor hovers or presses a link to another page of this site,
         render that page in the background so it appears instantly (other browsers ignore this) -->
    <script type="speculationrules">{"prerender":[{"where":{"and":[{"href_matches":"/*"},{"not":{"href_matches":["/*.mp4","/thank-you.html*"]}}]},"eagerness":"moderate"}]}</script>
    <meta name="robots" content="noindex, follow" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="description" content="Thank you for your inquiry. TRAVELDAY will be in touch shortly." />
    <link rel="canonical" href="https://luggage-dc.com/thank-you.html" />
    <link rel="icon" type="image/png" href="images/logo-travelday.png" />
    <link rel="apple-touch-icon" href="images/logo-travelday.png" />
    <noscript>
      <style>
        .primary-nav { visibility: visible !important; }
        .mobile-menu-button { display: none !important; }
      </style>
    </noscript>
    <link rel="stylesheet" href="styles.css?v=e620ff241c" />
    <link rel="stylesheet" href="thank-you.css?v=0db79df138" />
    <link rel="stylesheet" href="site-enhance.css?v=204e17f4c1" />

</head>

    <div class="page-stage">
      <div class="page-shell" id="top">
        <header class="site-header" data-section="navigation">
          <a class="brand" href="index.html" aria-label="TRAVELDAY home">
            <span class="brand-logo">
              <picture><source srcset="images/optimized/logo-travelday.webp" type="image/webp" /><img
                src="images/logo-travelday.png"
                alt="TRAVELDAY"
                width="480" height="240" loading="eager" decoding="async"
              /></picture>
            </span>
          </a>

          <button class="mobile-menu-button" type="button" aria-expanded="false" aria-controls="primaryNav">
            <span></span>
            <span></span>
            <span></span>
          </button>

          <nav class="primary-nav" id="primaryNav" aria-label="Primary navigation">
            <a href="index.html">Home</a>
            <a href="products/">Products</a>
            <a href="index.html#solutions">Solutions</a>
            <a href="about/">About</a>
            <a href="index.html#global">Market</a>
            <a href="index.html#contact">Contact</a>
          </nav>

          <div class="header-actions">
            <select class="language-select" aria-label="Language" onchange="window.setSiteLanguage && window.setSiteLanguage(this.value)" oninput="window.setSiteLanguage && window.setSiteLanguage(this.value)">
              <option value="zh">中文</option>
              <option value="en" selected>English</option>
              <option value="es">Español</option>
              <option value="hi">हिन्दी</option>
            </select>
            <a class="quote-button" href="index.html#contact">Get Quote →</a>
          </div>
        </header>

        <main class="thank-you-main">
          <section class="thank-you-hero" aria-labelledby="thankYouTitle">
            <div class="thank-you-products" aria-label="Luggage component showcase">
              <picture><source srcset="images/optimized/product-card-accessories.webp" type="image/webp" /><img class="thank-you-components" src="images/product-card-accessories.png" alt="Luggage handles, wheels and components" width="1672" height="941" loading="lazy" decoding="async" /></picture>
              <div class="thank-you-copy">
                <span class="thank-you-check" aria-hidden="true">✓</span>
                <h1 id="thankYouTitle" data-thank-you="title">Inquiry received</h1>
                <p data-thank-you="description">Thank you for your inquiry. We will contact you within 24 hours.</p>
                <div class="thank-you-actions">
                  <a class="button button-primary" href="index.html" data-thank-you="home">Back to home →</a>
                  <a class="button button-outline" href="products/" data-thank-you="products">View products</a>
                </div>
              </div>
            </div>
          </section>

    </div>
    <script src="shared-shell.js?v=0971f07e36" defer></script>

    <script src="site-enhance.js?v=00977ce2b4" defer></script>

</html>
