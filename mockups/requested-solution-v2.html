<!doctype html>
<html>
<head><meta charset="utf-8"><style>
  * { box-sizing: border-box; }
  html, body {
    width: 1600px;
    height: 1100px;
    margin: 0;
    overflow: hidden;
    background: linear-gradient(180deg, #f7f3ed 0%, #efe4d4 100%);
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .page {
    position: relative;
    width: 1540px;
    height: 1040px;
    border-radius: 34px;
    background: #fcfaf5;
    box-shadow: 0 18px 48px rgba(35, 28, 20, 0.12);
    overflow: hidden;
  }
  .logo {
    position: absolute;
    left: 70px;
    top: 58px;
    width: 170px;
    height: 58px;
    object-fit: contain;
  }
  .eyebrow {
    position: absolute;
    left: 92px;
    top: 166px;
    color: #b77a00;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.22em;
  }
  .title {
    position: absolute;
    left: 92px;
    top: 214px;
    width: 520px;
    color: #171411;
    font-size: 60px;
    font-weight: 700;
    line-height: 0.98;
    font-family: "SimHei", "Microsoft YaHei", sans-serif;
  }
  .subtitle {
    position: absolute;
    left: 92px;
    top: 384px;
    width: 460px;
    color: #6f655a;
    font-size: 18px;
    line-height: 1.8;
  }
  .pill {
    position: absolute;
    left: 92px;
    top: 474px;
    padding: 0 18px;
    height: 36px;
    border-radius: 999px;
    border: 1px solid #e3d9ca;
    background: #fff;
    color: #6f655a;
    font-size: 12px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
  }
  .top-image {
    position: absolute;
    right: 70px;
    top: 140px;
    width: 760px;
    height: 490px;
    border-radius: 30px;
    object-fit: cover;
    filter: saturate(0.96);
  }
  .top-overlay {
    position: absolute;
    right: 70px;
    top: 140px;
    width: 760px;
    height: 490px;
    border-radius: 30px;
    background: linear-gradient(180deg, rgba(31, 25, 20, 0.10), rgba(31, 25, 20, 0.28));
  }
  .chip {
    position: absolute;
    left: 744px;
    top: 164px;
    width: 240px;
    height: 40px;
    border-radius: 999px;
    background: rgba(255,255,255,0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #171411;
    font-size: 13px;
    font-weight: 800;
  }
  .bottom-panel {
    position: absolute;
    left: 92px;
    right: 92px;
    top: 712px;
    height: 250px;
    border-radius: 26px;
    overflow: hidden;
    border: 1px solid rgba(224, 214, 202, 0.92);
    background: linear-gradient(180deg, #fdfbf6 0%, #f6efe5 100%);
  }

  .question-side {
    position: absolute;
    left: 30px;
    top: 28px;
    width: 560px;
    height: 194px;
  }
  .bottom-tag {
    color: #b77a00;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.18em;
    margin-bottom: 12px;
  }
  .qa-title {
    color: #171411;
    font-size: 26px;
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 18px;
    font-family: "SimHei", "Microsoft YaHei", sans-serif;
  }
  .bubble {
    position: relative;
    border-radius: 18px;
    padding: 16px 18px;
    line-height: 1.65;
    font-size: 14px;
    color: #3d352d;
  }
  .bubble.customer {
    background: #fff;
    border: 1px solid #eadfcf;
    width: 520px;
    margin-bottom: 12px;
    box-shadow: 0 8px 18px rgba(50, 37, 24, 0.04);
  }
  .bubble.customer::before {
    content: "客户问";
    position: absolute;
    left: 18px;
    top: -12px;
    height: 24px;
    padding: 0 10px;
    border-radius: 999px;
    background: #171411;
    color: #fff;
    font-size: 11px;
    line-height: 24px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .bubble.answer {
    background: #171411;
    color: #fff;
    width: 520px;
  }
  .bubble.answer::before {
    content: "我们答";
    position: absolute;
    left: 18px;
    top: -12px;
    height: 24px;
    padding: 0 10px;
    border-radius: 999px;
    background: #c98d00;
    color: #fff;
    font-size: 11px;
    line-height: 24px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .chips {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
    width: 530px;
  }
  .mini-chip {
    height: 28px;
    padding: 0 12px;
    border-radius: 999px;
    border: 1px solid #e2d7c7;
    background: rgba(255,255,255,0.75);
    color: #665c50;
    font-size: 11px;
    font-weight: 700;
    line-height: 28px;
  }
  .hub {
    position: absolute;
    left: 632px;
    top: 86px;
    width: 148px;
    height: 76px;
    border-radius: 22px;
    background: linear-gradient(180deg, #f0e6d7 0%, #e8dcc9 100%);
    border: 1px solid rgba(193, 171, 137, 0.48);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    box-shadow: 0 10px 20px rgba(65, 45, 23, 0.08);
  }
  .hub .big {
    font-size: 18px;
    font-weight: 800;
    color: #171411;
    line-height: 1.1;
  }
  .hub .small {
    margin-top: 2px;
    font-size: 11px;
    color: #6f655a;
  }
  .product-zone {
    position: absolute;
    left: 806px;
    top: 24px;
    width: 604px;
    height: 204px;
    border-radius: 22px;
    background: linear-gradient(135deg, rgba(255,255,255,0.84), rgba(244, 235, 221, 0.72));
    overflow: hidden;
  }
  .product-grid {
    position: absolute;
    left: 0;
    top: 0;
    right: 0;
    bottom: 0;
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 10px;
    padding: 16px;
  }
  .product-main {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    background: #eee;
  }
  .product-main img,
  .product-small img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .product-small-stack {
    display: grid;
    gap: 10px;
  }
  .product-small {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    background: #eee;
  }
  .caption {
    position: absolute;
    left: 14px;
    bottom: 14px;
    right: 14px;
    height: 28px;
    border-radius: 999px;
    background: rgba(255,255,255,0.84);
    color: #171411;
    font-size: 12px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(10px);
  }
  .connector {
    position: absolute;
    left: 692px;
    top: 24px;
    width: 2px;
    height: 204px;
    background: linear-gradient(180deg, rgba(201, 141, 0, 0.0), rgba(201, 141, 0, 0.46), rgba(201, 141, 0, 0.0));
  }
  .connector::before,
  .connector::after {
    content: "";
    position: absolute;
    left: -3px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #c98d00;
    box-shadow: 0 0 0 5px rgba(201, 141, 0, 0.12);
  }
  .connector::before { top: 28px; }
  .connector::after { top: 146px; }
</style></head>
<body>

  <div class="page">
    <img class="logo" src="../images/logo-travelday.png" alt="TRAVELDAY" />
    <div class="eyebrow">SOLUTION</div>
    <div class="title">解决买家<br>找货难题</div>
    <div class="subtitle">把找货、协同和交付收成一条线。</div>
    <div class="pill">更少解释 · 更清晰的入口</div>
    <img class="top-image" src="../images/series-production.jpg" alt="top image" />
    <div class="top-overlay"></div>
    <div class="chip">One-stop supply chain</div>
  
  <div class="bottom-panel">
    <div class="question-side">
      <div class="bottom-tag">Q&A / RESOURCE INTEGRATION</div>
      <div class="qa-title">客户找的是一个人，<br>我们整合的是整条资源链。</div>
      <div class="bubble customer">要通过这个人买拉杆，通过那个人买手把，通过另外一个人买轮子，沟通成本太高，交期也很难统一。</div>
      <div class="bubble answer">我们不是单一工厂，而是资源整合商。拉杆、手把、轮子以及更多箱包相关资源，都能统一对接、统一匹配、统一交付。</div>
      <div class="chips">
        <div class="mini-chip">拉杆</div>
        <div class="mini-chip">手把</div>
        <div class="mini-chip">轮子</div>
        <div class="mini-chip">箱体</div>
        <div class="mini-chip">包材</div>
        <div class="mini-chip">整箱配套</div>
      </div>
    </div>
    <div class="hub">
      <div class="big">资源<br>整合商</div>
      <div class="small">一个入口 · 多种资源</div>
    </div>
    <div class="connector"></div>
    <div class="product-zone">
      <div class="product-grid">
        <div class="product-main">
          <img src="../images/series-production.jpg" alt="production" />
          <div class="caption">整箱协同</div>
        </div>
        <div class="product-small-stack">
          <div class="product-small">
            <img src="../images/series-handle.jpg" alt="handle" />
            <div class="caption">手把</div>
          </div>
          <div class="product-small">
            <img src="../images/series-wheels.jpg" alt="wheel" />
            <div class="caption">轮子</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
