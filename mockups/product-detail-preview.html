              ["轮组细节", "../images/detail/accessories-3.png", "center"],
              ["提手系列", "../images/detail/accessories-4.png", "center"],
              ["拉链系列", "../images/detail/accessories-5.png", "center"],
              ["底座部件", "../images/detail/accessories-6.png", "center"],
              ["角轮组件", "../images/detail/accessories-7.png", "center"],
              ["连接件", "../images/detail/accessories-8.png", "center"],
              ["配件组合", "../images/detail/accessories-9.png", "center"],
              ["组件细节", "../images/detail/accessories-10.png", "center"],
            ],
          },
        };

      const DEFAULT_PRODUCT = "luggage";
      const readProduct = () => {
        try {
          const key = new URLSearchParams(window.location.search).get("product");
          if (productDetailData[key]) return key;
        } catch {
          // Ignore malformed URLs.
        }
        return DEFAULT_PRODUCT;
      };
      const $detail = (key) => document.querySelector(`[data-detail="${key}"]`);
      const escapeAttr = (value) => String(value).replace(/"/g, "&quot;");

      onLanguage((lang) => {
        const page = pageCopy[lang] || pageCopy.en;
        const product = productDetailData[readProduct()];
        const detail = product.copy[lang] || product.copy.en;
        const galleryLabel = `${detail.title} ${page.gallerySuffix}`;
        setPageMeta(`TRAVELDAY | ${detail.title}`, lang);

        $detail("kicker").textContent = page.productDetail;
        $detail("title").textContent = detail.title;
        $detail("intro").textContent = detail.intro;
        $detail("proof").innerHTML = detail.proof
          .map((text, index) => `<div class="mini-card mk-point mk-point--simple"><span class="mk-index">0${index + 1}</span><strong>${text}</strong></div>`)
          .join("");
        const back = $detail("back");
        back.textContent = page.back;
        back.href = addLang("product-center-preview.html#catalog", lang);
        $detail("inquiry").textContent = page.inquiry;
        const hero = $detail("heroImage");
        hero.src = product.heroImage;
        hero.alt = detail.title;
        document.querySelector(".mk-hero")?.setAttribute("aria-label", galleryLabel);
        $detail("galleryTitle").textContent = galleryLabel;

        document.querySelector("[data-detail-gallery]").innerHTML = product.gallery
          .slice(0, 9)
          .map(([title, src, position = "center"]) => {
            // Gallery captions are authored in Chinese; show them only for zh.
            const caption = lang === "zh" ? `<figcaption>${title}</figcaption>` : "";
            const alt = lang === "zh" ? title : galleryLabel;
            return `<figure class="mk-shot"><img src="${src}" alt="${escapeAttr(alt)}" style="object-position: ${position}" loading="lazy" decoding="async" />${caption}</figure>`;
          })
          .join("");
      });

      });
    </script>
    <script src="../script.js?v=20261012-audit9" defer></script>
    <script src="../shared-inquiry.js?v=20261012-ux1b" defer></script>
  </body>
</html>
