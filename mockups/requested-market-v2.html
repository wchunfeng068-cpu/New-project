<!doctype html>
<html>
<head><meta charset="utf-8"><style>
  * { box-sizing: border-box; }
  html, body {
    width: 1600px;
    height: 1100px;
    margin: 0;
    overflow: hidden;
    background: linear-gradient(180deg, #f7f3ed 0%, #efe4d4 100%);
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .page {
    position: relative;
    width: 1540px;
    height: 1040px;
    border-radius: 34px;
    background: #fcfaf5;
    box-shadow: 0 18px 48px rgba(35, 28, 20, 0.12);
    overflow: hidden;
  }
  .logo {
    position: absolute;
    left: 70px;
    top: 58px;
    width: 170px;
    height: 58px;
    object-fit: contain;
  }
  .eyebrow {
    position: absolute;
    left: 92px;
    top: 166px;
    color: #b77a00;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.22em;
  }
  .title {
    position: absolute;
    left: 92px;
    top: 214px;
    width: 520px;
    color: #171411;
    font-size: 60px;
    font-weight: 700;
    line-height: 0.98;
    font-family: "SimHei", "Microsoft YaHei", sans-serif;
  }
  .subtitle {
    position: absolute;
    left: 92px;
    top: 384px;
    width: 460px;
    color: #6f655a;
    font-size: 18px;
    line-height: 1.8;
  }
  .pill {
    position: absolute;
    left: 92px;
    top: 474px;
    padding: 0 18px;
    height: 36px;
    border-radius: 999px;
    border: 1px solid #e3d9ca;
    background: #fff;
    color: #6f655a;
    font-size: 12px;
    font-weight: 700;
    display: inline-flex;
    align-items: center;
  }
  .top-image {
    position: absolute;
    right: 70px;
    top: 140px;
    width: 760px;
    height: 490px;
    border-radius: 30px;
    object-fit: cover;
    filter: saturate(0.96);
  }
  .top-overlay {
    position: absolute;
    right: 70px;
    top: 140px;
    width: 760px;
    height: 490px;
    border-radius: 30px;
    background: linear-gradient(180deg, rgba(31, 25, 20, 0.10), rgba(31, 25, 20, 0.28));
  }
  .chip {
    position: absolute;
    left: 744px;
    top: 164px;
    width: 240px;
    height: 40px;
    border-radius: 999px;
    background: rgba(255,255,255,0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #171411;
    font-size: 13px;
    font-weight: 800;
  }
  .bottom-panel {
    position: absolute;
    left: 92px;
    right: 92px;
    top: 712px;
    height: 250px;
    border-radius: 26px;
    overflow: hidden;
    border: 1px solid rgba(224, 214, 202, 0.92);
    background: linear-gradient(180deg, #fdfbf6 0%, #f6efe5 100%);
  }

  .market-left {
    position: absolute;
    left: 28px;
    top: 26px;
    width: 500px;
    height: 198px;
  }
  .market-head {
    color: #b77a00;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.18em;
    margin-bottom: 12px;
  }
  .market-title {
    color: #171411;
    font-size: 24px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 16px;
    font-family: "SimHei", "Microsoft YaHei", sans-serif;
  }
  .market-copy {
    color: #6f655a;
    font-size: 14px;
    line-height: 1.8;
    width: 450px;
  }
  .market-chips {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
    width: 470px;
  }
  .market-chip {
    height: 28px;
    padding: 0 12px;
    border-radius: 999px;
    border: 1px solid #e2d7c7;
    background: rgba(255,255,255,0.78);
    color: #665c50;
    font-size: 11px;
    font-weight: 700;
    line-height: 28px;
  }
  .market-map {
    position: absolute;
    left: 552px;
    top: 16px;
    width: 930px;
    height: 214px;
    border-radius: 22px;
    overflow: hidden;
    background: linear-gradient(135deg, rgba(255,255,255,0.82), rgba(239, 228, 212, 0.55));
  }
  .market-map img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: grayscale(0.1) saturate(0.92) contrast(0.98);
    opacity: 0.78;
  }
  .market-overlay {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(252, 250, 245, 0.00) 0%, rgba(252, 250, 245, 0.18) 38%, rgba(252, 250, 245, 0.04) 100%),
      radial-gradient(circle at 62% 44%, rgba(201, 141, 0, 0.22), rgba(201, 141, 0, 0.00) 24%),
      radial-gradient(circle at 74% 28%, rgba(201, 141, 0, 0.18), rgba(201, 141, 0, 0.00) 20%),
      radial-gradient(circle at 82% 63%, rgba(201, 141, 0, 0.15), rgba(201, 141, 0, 0.00) 22%);
  }
  .market-node {
    position: absolute;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #c98d00;
    box-shadow: 0 0 0 8px rgba(201, 141, 0, 0.11);
  }
  .market-node.one { left: 630px; top: 56px; }
  .market-node.two { left: 780px; top: 92px; }
  .market-node.three { left: 920px; top: 62px; }
  .market-node.four { left: 1040px; top: 120px; }
  .market-node.five { left: 1160px; top: 74px; }
  .market-line {
    position: absolute;
    left: 644px;
    top: 64px;
    width: 520px;
    height: 120px;
    border-top: 1px dashed rgba(201, 141, 0, 0.35);
    border-right: 1px dashed rgba(201, 141, 0, 0.35);
    border-bottom: 1px dashed rgba(201, 141, 0, 0.35);
    border-radius: 0 80px 80px 0;
    pointer-events: none;
  }
  .market-card {
    position: absolute;
    right: 24px;
    bottom: 22px;
    width: 218px;
    height: 56px;
    border-radius: 18px;
    background: rgba(255,255,255,0.85);
    border: 1px solid rgba(224, 214, 202, 0.78);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #171411;
    font-size: 13px;
    font-weight: 800;
    backdrop-filter: blur(10px);
  }
  .market-card span {
    display: block;
    color: #6f655a;
    font-size: 11px;
    font-weight: 600;
    margin-top: 2px;
  }
</style></head>
<body>

  <div class="page">
    <img class="logo" src="../images/logo-travelday.png" alt="TRAVELDAY" width="480" height="240" loading="lazy" decoding="async" />
    <div class="eyebrow">GLOBAL MARKET</div>
    <div class="title">把全球覆盖<br>做成一张图</div>
    <div class="subtitle">用地图表达区域覆盖，保持画面更干净。</div>
    <div class="pill">区域优先 · 信息克制</div>
    <img class="top-image" src="../images/server-map.jpg" alt="top image" width="1637" height="960" loading="lazy" decoding="async" />
    <div class="top-overlay"></div>
    <div class="chip">Coverage map</div>
  
  <div class="bottom-panel">
    <div class="market-left">
      <div class="market-head">MARKET / COVERAGE</div>
      <div class="market-title">市场不是一个点，<br>而是一张网络。</div>
      <div class="market-copy">用更克制的方式表达市场布局：有覆盖、有连接、有响应，也有统一的品牌感和节奏感。</div>
      <div class="market-chips">
        <div class="market-chip">全球视野</div>
        <div class="market-chip">多点协同</div>
        <div class="market-chip">统一输出</div>
        <div class="market-chip">快速响应</div>
      </div>
    </div>
    <div class="market-map">
      <img src="../images/server-map111.jpg" alt="market map" width="2379" height="661" loading="lazy" decoding="async" />
      <div class="market-overlay"></div>
      <div class="market-line"></div>
      <div class="market-node one"></div>
      <div class="market-node two"></div>
      <div class="market-node three"></div>
      <div class="market-node four"></div>
      <div class="market-node five"></div>
      <div class="market-card">
        市场布局
        <span>一图看懂覆盖和联动</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
